<header id="top">
  <h1><span class="logo">🏭</span><span class="nome">Fábrica de Tudo</span></h1>
  <button class="chip" id="mny" onclick="ecoMenu()" aria-label="Dinheiro e economia">💰</button>
  <button class="chip" id="nvl" onclick="progressoUI()" aria-label="Nível e missões"><b>Nv 1</b></button>
  <button class="b" onclick="menu()" aria-label="Menu">⋯</button>
</header>
<main id="view">
  <div id="world"><svg id="wires"></svg></div>
  <div id="zoom"><button class="b" onclick="zm(.8)" aria-label="Diminuir zoom">−</button><button class="b" onclick="fit()" aria-label="Centralizar tudo">⌖</button><button class="b" onclick="zm(1.25)" aria-label="Aumentar zoom">+</button></div>
</main>
<nav id="dock">
  <button onclick="undo()"><b>↩</b><span>Desfazer</span></button>
  <button onclick="aiToggle()"><b>🤖</b><span>IA</span></button>
  <button class="add" onclick="sh()" aria-label="Adicionar aparelho"><b>＋</b></button>
  <button onclick="progressoUI()"><b>🎯</b><span>Missões</span></button>
  <button onclick="halt(1)"><b>⏹</b><span>Parar</span></button>
</nav>
<section id="ai">
  <div class="aihd"><b>🤖 Assistente</b><span><button class="x" onclick="novaConversa()" aria-label="Nova conversa" title="Nova conversa">🗑</button><button class="x" onclick="aiToggle()" aria-label="Fechar assistente">✕</button></span></div>
  <details id="set"><summary>⚙ IA, chave e modelo</summary><select id="ap" onchange="provTroca()"></select><input id="au" placeholder="Endereço (ex: http://localhost:20128/v1)"><input id="ak" type="password" placeholder="Chave (fica só neste aparelho)" autocomplete="off"><input id="am" placeholder="Modelo"><div class="mu" id="apd"></div><input id="at" type="number" value="1200"><div class="mu">tamanho máximo da resposta (tokens). Se a resposta cortar, ela continua sozinha</div><label class="ck"><input type="checkbox" id="auto" checked>Continuar sozinha quando a resposta for cortada</label><label class="ck"><input type="checkbox" id="fix" checked>Testar e corrigir o código sozinha</label><label class="ck"><input type="checkbox" id="apl">Montar sozinha quando estiver sem erros</label><label class="ck"><input type="checkbox" id="think">Pensar mais (mais esperta, gasta mais tokens)</label><button class="it" onclick="listModels()">🔍 Buscar modelos da minha conta</button></details>
  <div id="msgs"></div><div id="chips"></div>
  <div class="aift">
    <button class="it" onclick="consoleUI()">🧰 Usar outra IA / comandos (colar resposta)</button>
    <select id="al"><option value="jsx">⚡ Código em: JavaScript (recomendado, a IA acerta mais)</option><option value="comand">📟 Código em: Comand (fácil, a IA erra mais)</option><option value="javascript">Código em: JavaScript (roda no Comand)</option><option value="lua">Código em: Lua (Roblox)</option><option value="python">Código em: Python</option><option value="csharp">Código em: C#</option><option value="java">Código em: Java</option><option value="cpp">Código em: C++</option><option value="html">Código em: HTML/CSS/JS</option></select>
    <div class="aiin"><textarea id="ain" rows="2" placeholder="Pergunte ou peça um sistema..."></textarea><button class="b env" onclick="ask()" aria-label="Enviar">➤</button></div>
  </div>
</section>
<div id="game"><div id="gcv"></div><button class="b" id="gx" onclick="gclose()" aria-label="Fechar tela cheia">✕</button><div id="gpad"></div></div>
<input type="file" id="lf" multiple hidden><input type="file" id="pf" accept=".json,.txt,application/json" hidden>
<div id="sheet"></div><div id="modal"><div id="mb"></div></div><div id="toast" role="status"></div>
