<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fábrica de Tudo</title>
<style>
/* Layout: barra de cima com dinheiro e nível · mesa infinita no meio · dock embaixo no celular.
   Cartões levam a cor da categoria (data-cat). Painéis abrem como folha de baixo. */
:root {
  --bg: #e9edf2; --card: #ffffff; --card2: #f6f8fa; --tx: #17202b; --mu: #5d6b7a; --bd: #d3dae2;
  --in: #f3f5f8; --ac: #d9480f; --ac2: #fff4ec; --ok: #15803d; --bad: #c92a2a; --wire: #7c8a99; --grid: #c9d2dc;
  --term: #0f1720; --termtx: #7ee2a8; --sh: 0 1px 2px #0000001a, 0 6px 18px #0000001f;
  --c0: #2f6fdd; --c1: #7c4ddb; --c2: #0e9fb5; --c3: #1f9d55; --c4: #a8661c; --c5: #e8590c; --c6: #c9930a; --c7: #d6336c; --c8: #0f9488; --c9: #7c8a99;
  --toph: 54px; --dockh: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1117; --card: #151c25; --card2: #1b2430; --tx: #e6edf3; --mu: #93a1b0; --bd: #2a3542; --in: #0f151d;
    --ac: #f76707; --ac2: #2b1b10; --ok: #2f9e44; --bad: #e03131; --wire: #8494a6; --grid: #1e2833; --term: #070b10; --termtx: #7ee2a8;
    --sh: 0 1px 2px #0006, 0 8px 22px #0007; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1117; --card: #151c25; --card2: #1b2430; --tx: #e6edf3; --mu: #93a1b0; --bd: #2a3542; --in: #0f151d;
  --ac: #f76707; --ac2: #2b1b10; --ok: #2f9e44; --bad: #e03131; --wire: #8494a6; --grid: #1e2833; --term: #070b10; --termtx: #7ee2a8;
  --sh: 0 1px 2px #0006, 0 8px 22px #0007; color-scheme: dark;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
*, *::before, *::after { box-sizing: inherit }
html, body { height: 100%; margin: 0; overscroll-behavior: none }
body {
  background: var(--bg); color: var(--tx); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .it:focus-visible { outline: 3px solid var(--ac); outline-offset: 2px }

/* ---------- barra de cima ---------- */
#top {
  height: var(--toph); flex: none; display: flex; gap: 8px; align-items: center; background: var(--card);
  border-bottom: 1px solid var(--bd); padding-block: 0;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); z-index: 5;
}
#top h1 { flex: 1; min-width: 0; margin: 0; display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap }
#top h1 .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--ac2); font-size: 19px; flex: none }
#top h1 .nome { overflow: hidden; text-overflow: ellipsis }
.chip {
  height: 36px; border: 1px solid var(--bd); background: var(--in); border-radius: 999px; padding: 0 12px;
  display: flex; align-items: center; gap: 6px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none;
}
#mny { color: var(--tx) }
#nvl { position: relative; padding-right: 10px }
#nvl .xpb { width: 42px; height: 6px; border-radius: 3px; background: var(--bd); overflow: hidden }
#nvl .xpb i { display: block; height: 100%; background: var(--ac); border-radius: 3px }
#nvl em { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--bad); color: #fff; font: 800 11px/18px system-ui; text-align: center; font-style: normal; padding: 0 4px }
.b {
  min-width: 40px; height: 40px; border: 1px solid var(--bd); background: var(--in); border-radius: 12px;
  font-size: 18px; padding: 0; display: inline-grid; place-items: center; flex: none;
}
@media (max-width: 420px) { #top h1 .nome { display: none } }

/* ---------- mesa ---------- */
#view {
  flex: 1; position: relative; overflow: hidden; touch-action: none;
  background-image: radial-gradient(var(--grid) 1.6px, transparent 1.6px); background-size: 24px 24px;
}
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0 }
#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; width: 1px; height: 1px }
#wires .v { fill: none; stroke: var(--wire); stroke-width: 3; stroke-linecap: round; opacity: .85; transition: stroke .2s, stroke-width .2s }
#wires .v.on { stroke: var(--ac); stroke-width: 5; opacity: 1; stroke-dasharray: 10 8; animation: flui .35s linear infinite }
@keyframes flui { to { stroke-dashoffset: -18 } }
#wires .h { fill: none; stroke: transparent; stroke-width: 26; pointer-events: stroke }
#zoom { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 3 }
#zoom .b { background: var(--card); box-shadow: var(--sh) }

/* ---------- cartões ---------- */
.card {
  --cc: var(--c9); position: absolute; width: 180px; background: var(--card); border: 1px solid var(--bd);
  border-radius: 14px; box-shadow: var(--sh); overflow: visible;
}
.card { width: 170px } .card.wide { width: 230px } .card.sm { width: 150px }
.card[data-cat="0"] { --cc: var(--c0) } .card[data-cat="1"] { --cc: var(--c1) } .card[data-cat="2"] { --cc: var(--c2) }
.card[data-cat="3"] { --cc: var(--c3) } .card[data-cat="4"] { --cc: var(--c4) } .card[data-cat="5"] { --cc: var(--c5) }
.card[data-cat="6"] { --cc: var(--c6) } .card[data-cat="7"] { --cc: var(--c7) } .card[data-cat="8"] { --cc: var(--c8) }
.hd {
  display: flex; align-items: center; gap: 6px; padding: 7px 6px 7px 8px; font-weight: 700; touch-action: none;
  border-radius: 13px 13px 0 0; background: linear-gradient(color-mix(in srgb, var(--cc) 16%, var(--card)), var(--card));
  border-top: 4px solid var(--cc); cursor: grab;
}
.hd .ic { font-style: normal; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--cc) 22%, var(--card)); flex: none; font-size: 15px }
.hd span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hd span small { color: var(--mu); font-weight: 600; margin-left: 4px }
.port {
  width: 24px; height: 24px; border-radius: 50%; background: var(--cc); border: 3px solid var(--card);
  box-shadow: 0 0 0 2px var(--cc); flex: none; cursor: crosshair;
}
.port.sel { background: var(--ac); box-shadow: 0 0 0 3px var(--ac), 0 0 0 7px color-mix(in srgb, var(--ac) 30%, transparent); animation: pulsa .9s ease-in-out infinite }
@keyframes pulsa { 50% { transform: scale(1.15) } }
.x { color: var(--mu); padding: 4px; font-size: 15px; cursor: pointer; border-radius: 6px }
.ft { display: flex; align-items: center; gap: 2px; padding: 0 6px 5px 10px; margin-top: -4px }
.ft small { flex: 1; color: var(--mu); font-weight: 700; font-size: 11px }
.ft .x { font-size: 13px; padding: 2px 6px }
.bd { padding: 4px 9px 10px; display: flex; flex-direction: column; gap: 7px }
input, textarea, select {
  width: 100%; background: var(--in); color: var(--tx); border: 1px solid var(--bd); border-radius: 10px;
  padding: 8px 10px; font: inherit; font-size: 16px; -webkit-user-select: text; user-select: text;
}
select { padding: 7px 8px; font-size: 15px }
input[type="checkbox"] { width: auto; accent-color: var(--ac) }
input[type="range"] { padding: 0; accent-color: var(--ac) }
input[type="color"] { height: 44px; padding: 2px }
textarea { font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; resize: vertical }
.bd button { min-height: 38px; border-radius: 10px; border: 0; background: var(--ac); color: #fff; font-weight: 700; padding: 0 10px }
.bd button.ok, button.ok { background: var(--ok); color: #fff; border: 0 }
.bd .it { background: var(--in); color: var(--tx); border: 1px solid var(--bd) }
.term {
  background: var(--term); color: var(--termtx); font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; padding: 7px 8px;
  border-radius: 10px; min-height: 36px; max-height: 120px; overflow: auto; white-space: pre-wrap; -webkit-user-select: text; user-select: text;
}
.log { min-height: 20px; max-height: 72px }
.rc { font-size: 12px; font-weight: 700; color: var(--tx); background: var(--card2); border-radius: 8px; padding: 5px 7px }
.pbar { height: 8px; border-radius: 4px; background: var(--in); border: 1px solid var(--bd); overflow: hidden }
.pbar i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--ac), #fab005) }
canvas.px { width: 128px; height: 128px; image-rendering: pixelated; background: #000; border-radius: 8px; align-self: center }
.bulb { width: 52px; height: 52px; border-radius: 50%; background: #475569; align-self: center; transition: .15s }
.pad { display: grid; grid-template-columns: repeat(3, 46px); gap: 5px; justify-content: center }
.pad button { padding: 0; height: 46px; border-radius: 12px }
.sem { display: flex; gap: 8px; justify-content: center }
.sem i { width: 30px; height: 30px; border-radius: 50%; background: #475569; transition: .15s }
.mu { color: var(--mu); font-size: 12px }

/* ---------- dock (barra de baixo) ---------- */
#dock {
  height: var(--dockh); flex: none; display: flex; align-items: center; justify-content: space-around; gap: 4px;
  background: var(--card); border-top: 1px solid var(--bd); z-index: 6;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-block: 0;
}
#dock button { flex: 1; max-width: 92px; height: 54px; border: 0; background: none; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px }
#dock button b { font-size: 21px; font-weight: 400; line-height: 1 }
#dock button span { font-size: 11px; font-weight: 700; color: var(--mu) }
#dock button.add { flex: none; width: 58px; height: 58px; margin-top: -26px; border-radius: 50%; background: var(--ac); color: #fff; box-shadow: 0 6px 16px color-mix(in srgb, var(--ac) 45%, transparent) }
#dock button.add b { font-size: 30px; font-weight: 300 }

/* ---------- catálogo ---------- */
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--bd);
  border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px #0003; display: none; flex-direction: column; max-height: 72%; z-index: 20;
  padding: 12px max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
#sheet.open { display: flex; animation: sobe .18s ease-out }
@keyframes sobe { from { transform: translateY(30px); opacity: .4 } }
.sheethd { display: flex; gap: 8px; align-items: center }
#abas { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 8px; scrollbar-width: none; flex: none }
#abas::-webkit-scrollbar { display: none }
.aba { flex: none; border: 1px solid var(--bd); background: var(--in); border-radius: 999px; padding: 7px 12px; font-weight: 700; font-size: 13px }
.aba.on { background: var(--tx); color: var(--card); border-color: var(--tx) }
#shl { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; align-content: start; padding-bottom: 4px }
.ch { grid-column: 1/-1; color: var(--mu); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 8px }
.it {
  padding: 10px 6px; border: 1px solid var(--bd); border-radius: 14px; background: var(--in); color: var(--tx); font: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0;
}
#shl .it span { font-size: 12px; font-weight: 700; line-height: 1.2 }
#shl .it b { font-size: 24px; font-weight: 400; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: color-mix(in srgb, var(--cc, var(--c9)) 18%, var(--card)) }
#shl .it small { font-size: 11px; color: var(--mu); font-weight: 700 }
#shl .it[data-cat="0"] { --cc: var(--c0) } #shl .it[data-cat="1"] { --cc: var(--c1) } #shl .it[data-cat="2"] { --cc: var(--c2) }
#shl .it[data-cat="3"] { --cc: var(--c3) } #shl .it[data-cat="4"] { --cc: var(--c4) } #shl .it[data-cat="5"] { --cc: var(--c5) }
#shl .it[data-cat="6"] { --cc: var(--c6) } #shl .it[data-cat="7"] { --cc: var(--c7) } #shl .it[data-cat="8"] { --cc: var(--c8) }
.it.trava { opacity: .55 }

/* ---------- janelas (folha de baixo no celular, centro no PC) ---------- */
#modal { position: fixed; inset: 0; background: #0009; display: none; z-index: 30; align-items: flex-end; justify-content: center }
#modal.open { display: flex }
#mb {
  background: var(--card); border-radius: 20px 20px 0 0; width: 100%; max-width: 560px; max-height: 86%; overflow: auto;
  display: flex; flex-direction: column; gap: 8px; animation: sobe .18s ease-out;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
#mb::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: var(--bd); align-self: center; margin: -6px 0 4px; flex: none }
@media (min-width: 700px) { #modal { align-items: center } #mb { border-radius: 20px; max-height: 80% } #mb::before { display: none } }
#mb > .it, #mb .it { flex-direction: row; justify-content: flex-start; padding: 12px 14px; text-align: left; gap: 10px; font-weight: 600 }
#mb pre { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 0; -webkit-user-select: text; user-select: text }
#mb .ch { margin-top: 10px }
.mt { font-size: 19px; font-weight: 800 }
.lin { display: flex; gap: 6px; align-items: center; border: 1px solid var(--bd); border-radius: 12px; padding: 6px 8px }
.lin span { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden }
.lin span small { color: var(--mu) }
.lin .it { padding: 8px 12px !important; flex: none }
.lvbox { background: var(--ac2); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px }
.lvbox b { font-size: 17px }
.lvbox small, .mis small, .cq small { color: var(--mu); font-size: 12px }
.mis { display: flex; gap: 10px; align-items: center; border: 1px solid var(--bd); border-radius: 14px; padding: 10px 12px }
.mis > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px }
.mis.pronta { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, var(--card)) }
.mis button { border-radius: 10px; padding: 10px 14px; font-weight: 800 }
.cq { display: flex; gap: 10px; align-items: center; padding: 6px 2px }
.cq > span { font-size: 22px; width: 40px; height: 40px; display: grid; place-items: center; background: var(--in); border-radius: 12px; flex: none }
.cq > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px }
.rec { font-size: 13px; padding: 6px 8px; border-radius: 10px; background: var(--in) }
.rec small { color: var(--mu); display: block }
.rec.trava { opacity: .6 }
.ck { display: flex; align-items: center; gap: 8px; font-size: 14px }

/* ---------- assistente ---------- */
#ai {
  position: fixed; left: 0; right: 0; bottom: 0; top: calc(var(--toph) + env(safe-area-inset-top, 0px)); background: var(--card);
  z-index: 25; display: none; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px);
}
#ai.open { display: flex }
.aihd { display: flex; align-items: center; justify-content: space-between; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--bd) }
.aihd b { font-size: 16px }
#set { padding: 8px 12px; border-bottom: 1px solid var(--bd); display: block }
#set summary { font-weight: 700; cursor: pointer }
#set > input, #set > .it, #set > .ck { margin-top: 8px }
#set > .it { width: 100%; flex-direction: row; justify-content: center }
#msgs { flex: 1; overflow: auto; padding: 10px 12px; -webkit-user-select: text; user-select: text }
.aift { border-top: 1px solid var(--bd); padding: 8px 12px; display: flex; flex-direction: column; gap: 6px }
.aift > .it { flex-direction: row; justify-content: center; padding: 8px }
.aiin { display: flex; gap: 6px }
.aiin textarea { flex: 1 }
.aihd span { display: flex; gap: 6px }
#set > select { margin-top: 8px; width: 100%; font-size: 16px; padding: 8px; background: var(--in); color: var(--tx); border: 1px solid var(--bd); border-radius: 8px }
#chips { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 6px; scrollbar-width: none }
#chips:empty { display: none }
#chips button { flex: none; border: 1px solid var(--bd); background: var(--in); color: var(--tx); border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap }
.msg { margin: 6px 0; padding: 8px; border-radius: 10px; background: var(--in); overflow-wrap: anywhere }
.msg.u { background: var(--ac); color: #fff; white-space: pre-wrap; margin-left: 32px }
.msg pre { background: #000; color: #4ade80; padding: 8px; border-radius: 8px; overflow: auto; font-size: 12px; margin: 6px 0 2px }
.msg .nota { font-size: 12px; margin-top: 6px; color: var(--mu, #9aa) }
.msg .nota.ok { color: #4ade80 }
.msg .nota.av { color: #f59e0b }
.plano { margin: 6px 0; display: grid; gap: 4px; font-size: 13px }
.plano div { background: var(--card); border-radius: 8px; padding: 6px 8px }
.digit::after { content: "▍"; animation: pisca 1s steps(2) infinite }
@keyframes pisca { 50% { opacity: 0 } }
.b.env { width: 56px; height: auto; background: var(--ac); color: #fff; border: 0 }

/* ---------- avisos, jogo em tela cheia, emulador ---------- */
#toast {
  position: fixed; left: 50%; top: calc(var(--toph) + 10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: #111827f0; color: #fff; padding: 10px 16px; border-radius: 14px; display: none; z-index: 40; font-size: 13px; font-weight: 600;
  max-width: min(92%, 520px); text-align: center; box-shadow: 0 8px 24px #0005;
}
#game { position: fixed; inset: 0; background: #000; z-index: 60; display: none; flex-direction: column; touch-action: none }
#game.open { display: flex }
#gcv { flex: 1; min-height: 0; display: flex }
#gcv canvas { width: 100% !important; height: 100% !important; object-fit: contain; image-rendering: pixelated }
#gx { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); right: 8px; opacity: .7 }
#gpad { display: flex; justify-content: space-between; align-items: flex-end; padding: 8px 14px calc(14px + env(safe-area-inset-bottom, 0px)) }
#gpad .g { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 6px }
#gpad button { width: 58px; height: 58px; border-radius: 50%; border: 2px solid #fff6; background: #fff2; color: #fff; font-size: 22px; padding: 0; touch-action: none }
#emu { position: fixed; inset: 0; z-index: 99999; background: #000; display: flex; flex-direction: column }
#emu iframe { flex: 1; width: 100%; border: 0 }
.emubar {
  display: flex; align-items: center; gap: 8px; background: #111; color: #fff; font-size: 13px;
  padding: calc(6px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px));
}
.emubar b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.emubar span { flex: 1; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.emubar button { border: 0; border-radius: 10px; background: #333; color: #fff; padding: 8px 12px; font-weight: 700; flex: none }
.emubar .sair { background: var(--bad) }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
/* menu em grade */
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
#mb .mgrid .it { flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; font-size: 13px; line-height: 1.25 }
#mb .mgrid .it b { font-size: 20px; font-weight: 400 }
/* tutorial */
#tut {
  display: none; position: fixed; z-index: 45; left: 50%; transform: translateX(-50%); width: min(92%, 440px);
  bottom: calc(var(--dockh) + 22px + env(safe-area-inset-bottom, 0px)); background: var(--card); color: var(--tx);
  border: 2px solid var(--ac); border-radius: 18px; padding: 12px 14px; box-shadow: 0 14px 40px #0006; animation: sobe .2s ease-out;
}
#tut.cima { bottom: auto; top: calc(var(--toph) + 10px + env(safe-area-inset-top, 0px)) }
#tut b { font-size: 16px; display: block }
#tut p { margin: 6px 0 10px; line-height: 1.45 }

<script>
const $ = (s) => document.querySelector(s),

let VARS = {},
  CMDS = {},
  D = {},
  W = [],
  nid = 1,
  V = { x: 10, y: 10, s: 1 },
  sel = null,
  cnt = 0,
  hu = 0,

  sl = (ms) => new Promise((r) => setTimeout(r, ms));
const q = (d, s) => document.querySelector("#c" + d.id + " " + s),

  tt = setTimeout(() => (t.style.display = "none"), Math.max(2200, m.length * 60));
}

/* ---- linguagem ---- */
const H = {
  Math,
  dados: (n) => LIB[n] && LIB[n].text,
  json: (s) => JSON.parse(s),
  tocar: (n) => tocar(n),
  Date,
  JSON,
  String,
  Number,
  Array,
  Object,
  parseInt,
  parseFloat,
  isNaN,
  parte: (s, i) => String(s).split(" ")[i],

  piso: Math.floor,
  teto: Math.ceil,
  max: Math.max,
  min: Math.min,
  aleatorio: (a, b) => Math.floor(Math.random() * (b - a + 1)) + a,
  arredondar: Math.round,
  texto: String,
  numero: Number,
  tamanho: (s) => (Array.isArray(s) ? s.length : String(s).length),
  lista: (...a) => a,
  adicionar: (l, v) => l.push(v),
  removerprimeiro: (l) => l.shift(),
  removerultimo: (l) => l.pop(),
  pegar: (l, i) => l[i],
  contem: (l, v) => l.includes(v),
  maiusculo: (s) => String(s).toUpperCase(),
  minusculo: (s) => String(s).toLowerCase(),
  raiz: Math.sqrt,
  agora: () => Date.now(),

const mkEnv = (v) =>
  new Proxy(v, {
    has: () => true,
    get: (t, k) =>
      typeof k == "symbol" ? undefined : k in t ? t[k] : Object.hasOwn(VARS, k) ? VARS[k] : k in H ? H[k] : 0,
    set: (t, k, x) => {
      if (Object.hasOwn(VARS, k)) {
        VARS[k] = x;
        save();
      } else t[k] = x;
      return true;
    },
  });
const cc = {};
function tr(e) {
  return e
    .split(/("(?:[^"\\]|\\.)*")/)
    .map((p, i) =>
      i % 2
        ? p
        : p
            .replace(/\bverdadeiro\b/g, "true")
            .replace(/\bfalso\b/g, "false")
            .replace(/\be\b/g, "&&")
            .replace(/\bou\b/g, "||")
            .replace(/\bnao\b/g, "!")
            .replace(/(?<![<>!=])=(?!=)/g, "=="),
    )
    .join("");
}
function ev(e, env) {
  const f = cc[e] || (cc[e] = new Function("E", "with(E){return(" + tr(e) + ")}"));
  return f(env);
}
function parse(src) {
  const L = src
    .split("\n")
    .map((s) => s.trim())
    .filter((s) => s && s[0] != "#");
  let i = 0;
  function blk() {
    const out = [];
    while (i < L.length) {
      const l = L[i];
      if (/^(fim|senao)$/i.test(l)) break;
      let m;
      if ((m = l.match(/^se (.+) entao$/i))) {
        i++;
        const a = blk();
        let b = [];
        if (/^senao$/i.test(L[i] || "")) {
          i++;
          b = blk();
        }
        i++;
        out.push({ t: "se", c: m[1], a, b });
      } else if ((m = l.match(/^repetir (.+)$/i))) {
        i++;
        const b = blk();
        i++;
        out.push({ t: "rep", c: m[1], b });
      } else if ((m = l.match(/^enquanto (.+)$/i))) {
        i++;
        const b = blk();
        i++;
        out.push({ t: "enq", c: m[1], b });
      } else if ((m = l.match(/^para (\w+) de (.+) ate (.+)$/i))) {
        i++;
        const b = blk();
        i++;
        out.push({ t: "for", v: m[1], a: m[2], z: m[3], b });
      } else {
        out.push({ t: "c", l });
        i++;
      }
    }
    return out;
  }
  const r = [];
  while (i < L.length) {
    r.push(...blk());
    i++;
  }
  return r;
}
function clog(d, t, err) {
  d.cl = (d.cl || []).concat((err ? "⚠ " : "") + t).slice(-20);
  const o = q(d, ".log");
  if (o) {
    o.textContent = d.cl.join("\n");
    o.scrollTop = 1e5;
  }
}
const AF = (async () => {}).constructor;
async function run(d, entrada) {
  if (d.run) {
    d.pend = entrada;
    return;
  }
  d.run = 1;
  d.stop = 0;
  let steps = 0;
  const env = d.env || (d.env = mkEnv({}));
  env.entrada = entrada;
  env.teclas = d.keys = d.keys || {};
  async function cmd(l) {
    let m;
    if ((m = l.match(/^([A-Za-z_]\w*)\s*(\+|-|\*|\/)?=(?!=)\s*(.+)$/))) {
      env[m[1]] = ev(m[2] ? m[1] + m[2] + "(" + m[3] + ")" : m[3], env);
      return;
    }
    const w = l.split(/\s+/)[0],
      a = l.slice(w.length).trim();
    if (CMDS[w.toLowerCase()]) {
      await callC(w, a ? ev("[" + a + "]", env) : []);
      return;
    }
    switch (w.toLowerCase()) {
      case "mostrar":
      case "enviar":
        emit(d, ev(a, env));
        break;
      case "log":
        clog(d, String(ev(a, env)));
        break;
      case "esperar":
        await sl(Number(ev(a, env)));
        break;
      case "pixel": {
        const [x, y, c] = ev("[" + a + "]", env);
        emit(d, { px: [x, y, c || "#fff"] });
        break;
      }
      case "limpar":
        emit(d, { clr: 1 });
        break;
      case "bip":
        T.som.recv(d, ev(a, env));
        break;
      case "retangulo": {
        const [x, y, w, h, c] = ev("[" + a + "]", env);
        emit(d, { rc: [x, y, w, h, c || "#fff"] });
        break;
      }
      case "vibrar":
        navigator.vibrate && navigator.vibrate(+ev(a || "100", env));
        break;
      case "linha": {
        const [x, y, x2, y2, c] = ev("[" + a + "]", env);
        emit(d, { ln: [x, y, x2, y2, c || "#fff"] });
        break;
      }
      case "circulo": {
        const [x, y, r, c] = ev("[" + a + "]", env);
        emit(d, { ci: [x, y, r, c || "#fff"] });
        break;
      }
      case "fundo":
        emit(d, { clr: 1, bg: ev(a, env) });
        break;
      case "imagem": {
        const [n, x, y, w, h] = ev("[" + a + "]", env);
        emit(d, { img: [n, x, y, w, h] });
        break;
      }
      case "tocar":
        tocar(ev(a, env));
        break;
      case "texto": {
        const [t, x, y, c, z] = ev("[" + a + "]", env);
        emit(d, { tx: [String(t), x, y, c || "#fff", z || 8] });
        break;
      }
      case "parar":
        throw "parado";
      default:
        try {
          ev(l, env);
        } catch (e) {
          throw e instanceof SyntaxError ? "não entendi: " + l : e;
        }
    }
  }
  async function ex(bl) {
    for (const n of bl) {
      if (d.stop) throw "parado";
      if (++steps > 40000) throw "muitos passos (loop infinito?)";
      if (steps % 100 == 0) await sl(0);
      if (n.t == "se") await ex(ev(n.c, env) ? n.a : n.b);
      else if (n.t == "rep") {
        const k = Number(ev(n.c, env));
        for (let j = 0; j < k; j++) await ex(n.b);
      } else if (n.t == "for") {
        const z = Number(ev(n.z, env));
        for (env[n.v] = Number(ev(n.a, env)); env[n.v] <= z; env[n.v]++) await ex(n.b);
      } else if (n.t == "enq") {
        while (ev(n.c, env)) {
          await ex(n.b);
          if (++steps > 40000) throw "loop infinito";
        }
      } else await cmd(n.l);
    }
  }
  async function runJs() {
    const api = {
      enviar: (v) => emit(d, v),
      mostrar: (v) => emit(d, v),
      log: (v) => clog(d, String(v)),
      esperar: (ms) => sl(ms),
      pixel: (x, y, c) => emit(d, { px: [x, y, c || "#fff"] }),
      retangulo: (x, y, w, h, c) => emit(d, { rc: [x, y, w, h, c || "#fff"] }),
      linha: (a, b, x, y, c) => emit(d, { ln: [a, b, x, y, c || "#fff"] }),
      circulo: (x, y, r, c) => emit(d, { ci: [x, y, r, c || "#fff"] }),
      fundo: (c) => emit(d, { clr: 1, bg: c }),
      limpar: () => emit(d, { clr: 1 }),
      bip: (f) => T.som.recv(d, f),
      vibrar: (ms) => navigator.vibrate && navigator.vibrate(ms || 100),
      parar: () => {
        throw "parado";
      },
      console: { log: (v) => clog(d, String(v)) },
    };
    Object.assign(env, api);
    await new AF("E", "with(E){" + d.s.code + "\n}")(env);
  }
  async function runJsx() {
    if (!d.fn || d.fc !== d.s.code) {
      d.fc = d.s.code;
      d.fn = new AF("E", "with(E){" + d.s.code + "\n}");
    }
    d.S = d.S || {};
    const dr = DRAW(d),
      E = {
        entrada,
        S: d.S,
        teclas: d.keys,
        tela: mkFb(d),
        enviar: (v) => emit(d, v),
        log: (v) => clog(d, String(v)),
        esperar: sl,
        bip: (f) => T.som.recv(d, f),
        vibrar: (ms) => navigator.vibrate && navigator.vibrate(ms || 100),
        agora: () => performance.now(),
        aleatorio: H.aleatorio,
        rgb,
        lib: LIBAPI,
        variaveis: VARS,
        comando: (n, ...a) => callC(n, a),
      };
    DN.forEach((k, i) => (E[k] = dr[i]));
    await d.fn(E);
  }
  let depth = 0;
  async function callC(name, args) {
    const c = CMDS[String(name).toLowerCase()];
    if (!c) throw "comando desconhecido: " + name;
    if (depth >= 80) throw "recursão demais";
    depth++;
    const sv = c.p.map((k) => env[k]);
    c.p.forEach((k, i) => (env[k] = args[i] === undefined ? 0 : args[i]));
    try {
      await ex(parse(c.body));
    } finally {
      depth--;
      c.p.forEach((k, i) => (env[k] = sv[i]));
    }
  }
  async function runPy() {
    if (!PYP) clog(d, "⏳ Carregando Python (só na 1ª vez, ~10 MB)...");
    const py = await pyLoad();
    let ns = d.pn;
    if (!ns) {
      ns = d.pn = py.globals.get("dict")();
      const tj = (v) => (v && v.toJs ? v.toJs() : v);
      Object.entries({
        enviar: (v) => emit(d, tj(v)),
        mostrar: (v) => emit(d, tj(v)),
        log: (v) => clog(d, String(tj(v))),
        esperar: sl,
        bip: (f) => T.som.recv(d, f),
        vibrar: (ms) => navigator.vibrate && navigator.vibrate(ms || 100),
        agora: () => performance.now(),
        aleatorio: H.aleatorio,
        rgb,
        tela: mkFb(d),
        dados: LIBAPI.dados,
        tocar,
        pixels: LIBAPI.pixels,
        pixel: (x, y, c) => emit(d, { px: [x, y, c || "#fff"] }),
        retangulo: (x, y, w, h, c) => emit(d, { rc: [x, y, w, h, c || "#fff"] }),
        linha: (a, b, x, y, c) => emit(d, { ln: [a, b, x, y, c || "#fff"] }),
        circulo: (x, y, r, c) => emit(d, { ci: [x, y, r, c || "#fff"] }),
        fundo: (c) => emit(d, { clr: 1, bg: c }),
        limpar: () => emit(d, { clr: 1 }),
        imagem: (n, x, y, w, h) => emit(d, { img: [n, x, y, w, h] }),
        variaveis: VARS,
        comando: (n, ...a) => callC(n, a.map(tj)),
      }).forEach(([k, f]) => ns.set(k, f));
    }
    ns.set("entrada", entrada);
    ns.set("teclas", py.toPy({ cima: 0, baixo: 0, esquerda: 0, direita: 0, A: 0, B: 0, ...d.keys }));
    try {
      await py.runPythonAsync(d.s.code, { globals: ns });
    } catch (e) {
      throw new Error(String(e.message).trim().split("\n").slice(-3).join(" | "));
    }
  }
  try {
    const lg = glang(d);
    if (lg != (d.s.lang || "")) {
      d.s.lang = lg;
      const e = q(d, "[data-k=lang]");
      if (e) e.value = lg;
      save();
    }
    if (lg == "py") await runPy();
    else if (lg == "jsx" || lg == "js") await runJsx();
    else await ex(parse(d.s.code));
    track("run");
  } catch (e) {
    if (e !== "parado") clog(d, e.message || String(e), 1);
  }
  d.run = 0;
  if (d.pend !== undefined) {
    const p = d.pend;
    d.pend = undefined;
    run(d, p);
  }
}

/* ---- dispositivos ---- */

const CODE = '# o valor recebido fica em "entrada"\nmostrar "Recebi: " + entrada';
const T = {
  valor: {

  hub: {

  tela: {
    i: "🖥",

    s: {},
    ui: () => `<div class=term></div><canvas class=px width=16 height=16></canvas>`,
    recv(d, v) {

    i: "💻",

    s: { t: "" },
    w: 1,
    ui: (d) =>
      `<div class=term style="min-height:70px"></div><input data-k=t placeholder="digite e envie" value="${esc(d.s.t)}"><button data-a=send>Enviar ⏎</button><div class="mu eco"></div>`,

function emit(src, v) {
  const seen = new Set([src.id]),
    qq = [src.id];
  while (qq.length) {
    const a = qq.shift();
    W.forEach((w, i) => {
      if (!w.includes(a)) return;
      const b = w[0] == a ? w[1] : w[0];
      if (seen.has(b)) return;
      seen.add(b);
      flash(i);
      const t = D[b];
      if (!t) return;
      if (t.type == "hub") {
        const o = q(t, ".term");
        if (o && typeof v != "object") o.textContent = String(v).slice(0, 14);
        qq.push(b);
      } else deliver(t, v, { de: a, origem: src.id });
    });
  }
}
// Envia só para um vizinho direto (usado por Divisor e máquinas que escolhem a saída).
function emitTo(src, alvo, v) {
  const i = W.findIndex((w) => w.includes(src.id) && w.includes(alvo));
  if (i < 0) return;
  flash(i);
  const t = D[alvo];
  if (!t) return;
  if (t.type == "hub") {
    const o = q(t, ".term");
    if (o && typeof v != "object") o.textContent = String(v).slice(0, 14);
    // o Conjunto repassa para todos os outros ligados nele, menos quem enviou
    const seen = new Set([src.id, alvo]),
      qq = [alvo];
    while (qq.length) {
      const a = qq.shift();
      W.forEach((w, k) => {
        if (!w.includes(a)) return;
        const b = w[0] == a ? w[1] : w[0];
        if (seen.has(b)) return;
        seen.add(b);
        flash(k);
        const u = D[b];
        if (!u) return;
        if (u.type == "hub") qq.push(b);
        else deliver(u, v, { de: a, origem: src.id });
      });
    }
  } else deliver(t, v, { de: src.id, origem: src.id });
}

const rgb = (r, g, b) => ((255 << 24) | ((b & 255) << 16) | ((g & 255) << 8) | (r & 255)) >>> 0,
  CC = {},
  cx2 = document.createElement("canvas").getContext("2d");
function cl(c) {
  if (typeof c == "number") return c;
  if (Array.isArray(c)) return rgb(c[0], c[1], c[2]);
  if (CC[c] !== undefined) return CC[c];
  cx2.fillStyle = "#000";
  cx2.fillStyle = c;
  const h = cx2.fillStyle;
  return (CC[c] =
    h[0] == "#"
      ? rgb(parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16))
      : 0xff000000);
}
function mkFb(d) {
  return (w, h) => {
    w |= 0;
    h |= 0;
    let f = d.fb;
    if (!f || f.w != w || f.h != h) {
      const bf = new ArrayBuffer(w * h * 4),
        u8 = new Uint8ClampedArray(bf),
        u = new Uint32Array(bf);
      f = d.fb = {
        w,
        h,
        limpar: (c) => u.fill(cl(c)),
        px: (x, y, c) => {
          x |= 0;
          y |= 0;
          if (x >= 0 && y >= 0 && x < w && y < h) u[y * w + x] = cl(c);
        },
        vlinha: (x, y0, y1, c) => {
          x |= 0;
          if (x < 0 || x >= w) return;
          y0 = Math.max(0, y0 | 0);
          y1 = Math.min(h - 1, y1 | 0);
          c = cl(c);
          for (let y = y0; y <= y1; y++) u[y * w + x] = c;
        },
        ret: (x, y, a, b2, c) => {
          c = cl(c);
          const x1 = Math.min(w, (x + a) | 0),
            y1 = Math.min(h, (y + b2) | 0);
          for (let j = Math.max(0, y | 0); j < y1; j++)
            for (let i = Math.max(0, x | 0); i < x1; i++) u[j * w + i] = c;
        },
        sprite: (n, x, y, a, b2) => {
          const p = LIBAPI.pixels(n);
          if (!p) return;
          a = a | 0 || p.w;
          b2 = b2 | 0 || p.h;
          for (let j = 0; j < b2; j++) {
            const yy = (y | 0) + j;
            if (yy < 0 || yy >= h) continue;
            const sr = (((j * p.h) / b2) | 0) * p.w;
            for (let i = 0; i < a; i++) {
              const xx = (x | 0) + i;
              if (xx < 0 || xx >= w) continue;
              const c2 = p.d[sr + (((i * p.w) / a) | 0)];
              if (c2 >>> 24 > 127) u[yy * w + xx] = c2;
            }
          }
        },
        texto: (t, x, y, c, sz) => {
          t = String(t);
          sz = sz >= 4 ? sz : 8 * (sz || 1);
          const g = TC.canvas;
          TC.font = sz + "px monospace";
          const tw = Math.ceil(TC.measureText(t).width) + 1,
            th = sz + 2;
          g.width = tw;
          g.height = th;
          TC.font = sz + "px monospace";
          TC.textBaseline = "top";
          TC.fillStyle = "#fff";
          TC.fillText(t, 0, 0);
          const im = TC.getImageData(0, 0, tw, th).data;
          c = cl(c || "#fff");
          for (let j = 0; j < th; j++)
            for (let i = 0; i < tw; i++) {
              const X = (x | 0) + i,
                Y = (y | 0) + j;
              if (im[(j * tw + i) * 4 + 3] > 110 && X >= 0 && Y >= 0 && X < w && Y < h) u[Y * w + X] = c;
            }
        },
        mostrar: () => emit(d, { fb: { w, h, d: u8.slice() } }),
      };
    }
    return f;
  };
}

const idb = () =>
  IDBp ||

      const r = indexedDB.open("fabrica", 2);

        const db = r.result;
        if (!db.objectStoreNames.contains("lib")) db.createObjectStore("lib", { keyPath: "name" });
        if (!db.objectStoreNames.contains("jogos")) db.createObjectStore("jogos", { keyPath: "name" });

const lput = async (it) => {
  const db = await idb();
  return new Promise((ok, no) => {
    const t = db.transaction("lib", "readwrite");
    t.objectStore("lib").put(it);
    t.oncomplete = ok;
    t.onerror = () => no(t.error);
  });
};
const ldel = async (n) => {
  const db = await idb();
  return new Promise((ok) => {
    const t = db.transaction("lib", "readwrite");
    t.objectStore("lib").delete(n);

  });
};
const lall = async () => {

  });
};

      c.width = o.obj.naturalWidth;
      c.height = o.obj.naturalHeight;
      const x = c.getContext("2d");
      x.drawImage(o.obj, 0, 0);
      o.px = {
        w: c.width,
        h: c.height,
        d: new Uint32Array(x.getImageData(0, 0, c.width, c.height).data.buffer.slice(0)),

  },

function drw(c, n, v) {
  if (v.clr) {
    if (v.bg) {
      c.fillStyle = v.bg;
      c.fillRect(0, 0, n, n);
    } else c.clearRect(0, 0, n, n);
  } else if (v.rc) {
    c.fillStyle = v.rc[4];
    c.fillRect(v.rc[0], v.rc[1], v.rc[2], v.rc[3]);
  } else if (v.px) {
    c.fillStyle = v.px[2];
    c.fillRect(v.px[0] | 0, v.px[1] | 0, 1, 1);
  } else if (v.ln) {
    const [a, b, x, y, col] = v.ln,
      s = Math.max(Math.abs(x - a), Math.abs(y - b), 1);
    c.fillStyle = col;
    for (let i = 0; i <= s; i++)
      c.fillRect(Math.round(a + ((x - a) * i) / s), Math.round(b + ((y - b) * i) / s), 1, 1);
  } else if (v.img) {
    const o = LIB[v.img[0]];
    if (o && o.obj && o.obj.complete) {
      c.imageSmoothingEnabled = false;
      c.drawImage(o.obj, v.img[1] | 0, v.img[2] | 0, v.img[3] || o.obj.width, v.img[4] || o.obj.height);
    }
  } else if (v.tx) {
    const [t, x, y, col, sz] = v.tx;
    c.fillStyle = col;
    c.font = (sz >= 4 ? sz : 8 * (sz || 1)) + "px monospace";
    c.textBaseline = "top";
    c.fillText(t, x, y);
  } else if (v.ci) {
    const [a, b, r, col] = v.ci;
    c.fillStyle = col;
    for (let i = -r; i <= r; i++)
      for (let j = -r; j <= r; j++) if (i * i + j * j <= r * r) c.fillRect(a + i, b + j, 1, 1);
  }
}

async function groq(body, vivo) {
  provGuarda();
  const k = $("#ak").value.trim(),
    url = provURL() + "/chat/completions";
  let mt = Math.max(200, +$("#at").value || 1200),
    ef = 1,
    rl = 0,
    st = !!vivo;
  for (let i = 0; i < 14; i++) {
    const b = { ...body, max_tokens: mt },
      h = { "Content-Type": "application/json" };
    if (st) b.stream = true;
    if (PC.p == "groq" && ef && !$("#think").checked) b.reasoning_effort = "none";
    if (k) h.Authorization = "Bearer " + k;
    const r = await fetch(url, { method: "POST", headers: h, body: JSON.stringify(b) });
    if (r.ok && st && /event-stream/.test(r.headers.get("content-type") || "")) return lerStream(r, vivo);
    let j = {};
    try {
      j = await r.json();
    } catch (e) {
      if (r.ok) throw new Error("resposta estranha do servidor");
    }
    if (Array.isArray(j)) j = j[0] || {};
    if (r.ok) return j;
    const m = String((j.error && (j.error.message || j.error)) || "erro " + r.status),
      lim = m.match(/Limit (\d+)/);
    if (/reasoning/i.test(m) && ef) {
      ef = 0;
      continue;
    }
    if (/stream/i.test(m) && st) {
      st = false;
      continue;
    }
    if (/too large|max_tokens/i.test(m) && lim && mt > 200) {
      mt = Math.max(200, Math.min(mt - 100, +lim[1] - 150));
      continue;
    }
    if (/rate limit|quota|429/i.test(m) || r.status == 429) {
      const t = m.match(/try again in (?:(\d+)m)?([\d.]+)s/i),
        w = t ? +(t[1] || 0) * 60 + +t[2] : 15;
      if (w <= 75 && rl++ < 4) {
        await waitUI(w);
        continue;
      }
      throw new Error("Limite da " + provNome() + " atingido. Tente de novo em " + Math.ceil(w) + "s.");
    }
    if (r.status == 401 || /api key|unauthorized|invalid.*key/i.test(m))
      throw new Error("chave recusada pela " + provNome() + ". Confira a chave em ⚙.");
    throw new Error(m);

async function lerStream(r, vivo) {
  const rd = r.body.getReader(),
    dec = new TextDecoder();
  let buf = "",
    txt = "",
    pensa = "",
    fin = null;
  for (;;) {
    const { value, done } = await rd.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const l = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (!l.startsWith("data:")) continue;
      const dd = l.slice(5).trim();
      if (dd == "[DONE]") continue;
      let j;
      try {
        j = JSON.parse(dd);
      } catch (e) {
        continue;
      }
      if (j.error) throw new Error(j.error.message || String(j.error));
      const c = j.choices && j.choices[0];
      if (!c) continue;
      const dt = c.delta || {};
      if (dt.content) txt += dt.content;
      if (dt.reasoning || dt.reasoning_content) pensa += dt.reasoning || dt.reasoning_content;
      if (c.finish_reason) fin = c.finish_reason;
      vivo(txt, pensa);
    }
  }
  return { choices: [{ message: { content: txt }, finish_reason: fin || "stop" }] };
}

      } else if ((m = l.match(/^para (\w+) de (.+) ate (.+)$/i))) {

/* -- Planejador: calcula a linha de produção completa de qualquer item, sem IA -- */
const nkI = (s) =>
  String(s)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "");
const receitaDe = (it) => Object.keys(RECEITAS).find((k) => RECEITAS[k].out == it);
const nivelItem = (it) => (BRUTOS.includes(it) ? ITENS[it][2] : RECEITAS[receitaDe(it)].lv);
function planoFab(alvo) {
  const prof = {}; // item -> distância até o produto final (0 = o próprio)
  const visita = (it, d) => {
    if (prof[it] !== undefined && prof[it] >= d) return;
    prof[it] = d;
    if (BRUTOS.includes(it)) return;
    const r = RECEITAS[receitaDe(it)];
    if (!r) throw new Error("não sei fazer " + it);
    Object.keys(r.in).forEach((x) => visita(x, d + 1));
  };
  visita(alvo, 0);
  const itens = Object.keys(prof),
    brutos = itens.filter((it) => BRUTOS.includes(it)),
    feitos = itens.filter((it) => !BRUTOS.includes(it)),
    fundo = Math.max(0, ...feitos.map((it) => prof[it]));
  // extratores na coluna 0, máquinas da mais básica para a final, mercado no fim
  const maqs = feitos.map((it) => {
    const r = receitaDe(it);
    return { it, r, m: RECEITAS[r].m, col: 1 + fundo - prof[it] };
  });
  const custo =
    brutos.length * T.extrator.price + maqs.reduce((s, x) => s + T[x.m].price, 0) + T.mercado.price;
  const falta = ECO.f ? [] : itens.filter((it) => nivelItem(it) > nivel()).map((it) => [it, nivelItem(it)]);
  return { alvo, brutos, maqs, custo, falta, cols: feitos.length ? fundo + 2 : 1 };
}
function montaPlano(alvo) {
  let P;
  try {
    P = planoFab(alvo);
  } catch (e) {
    return toast(e.message);
  }
  if (P.falta.length) {
    const n = Math.max(...P.falta.map((x) => x[1]));
    return toast(`🔒 ${alvo} precisa do nível ${n} (você está no ${nivel()})`);
  }
  if (!pay(P.custo)) return;
  snap();
  // monta à direita do que já existe, para não cobrir nada
  const L = Object.values(D),
    ox = L.length ? Math.max(...L.map((d) => d.x)) + 320 : -V.x / V.s + 20,
    oy = L.length ? Math.min(...L.map((d) => d.y)) : -V.y / V.s + 20,
    lin = {},
    id = {},
    pos = (c) => [ox + c * 270, oy + (lin[c] = (lin[c] || 0) + 1) * 250 - 250];
  P.brutos.forEach((b) => (id[b] = add("extrator", ...pos(0), { res: b })));
  [...P.maqs].sort((a, b) => a.col - b.col).forEach((m) => (id[m.it] = add(m.m, ...pos(m.col), { lv: 1, r: m.r })));
  const mc = add("mercado", ...pos(P.cols));
  P.maqs.forEach((m) => Object.keys(RECEITAS[m.r].in).forEach((i) => W.push([id[i].id, id[m.it].id])));
  W.push([id[alvo].id, mc.id]);
  wires();
  save();
  P.brutos.forEach((b) => T.extrator.act(id[b], "go", q(id[b], "[data-a=go]")));
  $("#ai").classList.remove("open");
  fit();
  track("plano");
  toast(`🏭 Linha de ${alvo} montada: ${P.brutos.length} extratores, ${P.maqs.length} máquinas`);
}

  const n = nkI(t);

function vpix(o) {
  const v = o.obj;
  if (v.readyState < 2 || !v.videoWidth) return null;
  const k = Math.min(1, 160 / v.videoWidth),
    w = Math.max(1, (v.videoWidth * k) | 0),
    h = Math.max(1, (v.videoHeight * k) | 0),
    c = o.cv || (o.cv = document.createElement("canvas"));
  c.width = w;
  c.height = h;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(v, 0, 0, w, h);
  return { w, h, d: new Uint32Array(x.getImageData(0, 0, w, h).data.buffer) };
}

      c = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 2654435761);

// Reduz um quadro (framebuffer) por um fator k < 1, pegando o pixel mais próximo
function reduzQuadro(f, k) {
  const w = Math.max(1, Math.floor(f.w * k)),
    h = Math.max(1, Math.floor(f.h * k)),
    od = new Uint8ClampedArray(w * h * 4),
    o = new Uint32Array(od.buffer),
    sr = new Uint32Array(f.d.buffer, f.d.byteOffset, f.d.length >> 2);
  for (let y = 0; y < h; y++) {
    const r = Math.floor(y / k) * f.w;
    for (let x = 0; x < w; x++) o[y * w + x] = sr[r + Math.floor(x / k)];
  }
  return { w, h, d: od };
}

function melhorar(d) {

function maqUI(d) {
  const r = RECEITAS[d.s.r],
    inv = d.inv || {};

  return `<select data-k=r onchange="maqTroca(${d.id})">${ops}</select><div class=rc>${r ? txtReceita(r) : ""}</div><div class="term inv">${est}</div><div class=pbar><i></i></div>${btnUp(d)}`;

function maqTroca(id) {

function maqTexto(d) {
  const t = q(d, ".inv"),
    r = RECEITAS[d.s.r];
  if (!t || !r) return;
  const inv = d.inv || {};
  t.textContent =
    Object.entries(r.in)
      .map(([k, n]) => `${ic(k)} ${inv[k] || 0}/${n}`)
      .join("  ") + `\nfeitos: ${d.n || 0} · ${(dur(d, r.t) / 1000).toFixed(1)}s cada`;
}
function maqTenta(d) {
  const r = RECEITAS[d.s.r];
  if (d.bz || !r || !liberado(r.lv)) return;
  const inv = (d.inv = d.inv || {});
  if (!Object.entries(r.in).every(([k, n]) => (inv[k] || 0) >= n)) return;
  Object.entries(r.in).forEach(([k, n]) => (inv[k] -= n));
  d.bz = 1;
  const ms = dur(d, r.t),
    bar = q(d, ".pbar i");
  if (bar) {
    bar.style.transition = "none";
    bar.style.width = "0";
    bar.offsetWidth; // reinicia a animação
    bar.style.transition = `width ${ms}ms linear`;
    bar.style.width = "100%";
  }
  setTimeout(() => {
    d.bz = 0;
    if (D[d.id] !== d) return;
    for (let i = 0; i < r.q; i++) emit(d, r.out);
    d.n = (d.n || 0) + r.q;
    track("item", r.out, r.q);
    maqTexto(d);
    maqTenta(d);
  }, ms);
  maqTexto(d);
}

const HASH = [0.3, 1, 4, 16, 64],
  btcDiff = () => 30 * 1.02 ** BTCN,
  btcReward = () => 0.001 / 2 ** Math.floor(BTCN / 100);
FAC.rig = 10;
function rigStat(d) {
  const c = cpuInfo(d),
    sh = c.pw ? W.filter((w) => w.includes(c.id)).length || 1 : 1,
    hs = (HASH[c.pw] * (1 + 0.5 * (lvl(d) - 1))) / sh;
  return { c, hs, en: ECO.f ? 0 : 0.05 + 0.05 * hs };
}
function rigText(d) {
  const t = q(d, ".term");
  if (!t) return;
  const { c, hs, en } = rigStat(d),
    x = `Nv ${lvl(d)} · ${hs.toFixed(2)} H/s · energia $${en.toFixed(2)}/s\n${d.low ? "⚠ sem dinheiro para a energia" : !c.pw ? "⚠ sem processador: ligue um 🔲 com fio" : d.h ? "⛏ minerando..." : "parado"}\nprogresso ${Math.floor(d.pg || 0)}/${Math.floor(btcDiff())} · blocos ${d.nb || 0}\n₿ minerados: ${(d.got || 0).toFixed(4)}`;
  if (t.textContent != x) t.textContent = x;
}
function rigTick(d) {
  const { hs, en } = rigStat(d);
  d.low = 0;
  if (en) {
    if (M < en) {
      d.low = 1;
      rigText(d);
      return;
    }
    M -= en;
    saveM();
    hud();
  }
  d.pg = (d.pg || 0) + hs;
  let n = 0;
  while (d.pg >= btcDiff() && n++ < 50) {
    d.pg -= btcDiff();
    const r = btcReward();
    BTC += r;
    BTCN++;
    track("bloco");
    d.nb = (d.nb || 0) + 1;
    d.got = (d.got || 0) + r;
    emit(d, "bloco");
  }
  if (n) {
    saveM();
    hud();
  }
  rigText(d);
}

function crc16(t) {
  let c = 0xffff;
  for (const ch of t) {
    c ^= ch.charCodeAt(0) << 8;
    for (let i = 0; i < 8; i++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xffff : (c << 1) & 0xffff;
  }
  return c.toString(16).toUpperCase().padStart(4, "0");
}

async function pkVerify(oid, sig) {
  try {
    if (!(window.crypto && crypto.subtle)) {
      toast("Abra o arquivo em um navegador (Chrome) para validar o código");
      return false;
    }
    const k = await crypto.subtle.importKey("jwk", PUBKEY, { name: "ECDSA", namedCurve: "P-256" }, false, [
        "verify",
      ]),
      b = Uint8Array.from(atob(String(sig).replace(/\s/g, "").replace(/-/g, "+").replace(/_/g, "/")), (c) =>
        c.charCodeAt(0),
      );
    return await crypto.subtle.verify(
      { name: "ECDSA", hash: "SHA-256" },
      k,
      b,
      new TextEncoder().encode("FABRICA-PACK1:" + oid),
    );
  } catch (e) {
    return false;
  }
}

function emuSys(d) {

function xp(n) {
  PROG.xp += n;
  let subiu = 0;
  while (PROG.xp >= xpNivel(PROG.lv)) {
    PROG.xp -= xpNivel(PROG.lv);
    PROG.lv++;
    subiu = 1;
  }
  if (subiu) {
    const novos = Object.keys(ITENS).filter((k) => ITENS[k][2] == PROG.lv);
    toast(`⭐ Nível ${PROG.lv}!` + (novos.length ? " Liberou: " + novos.map((k) => ic(k) + " " + k).join(", ") : ""));
    // menus de receita e recurso mudam com o nível
    Object.values(D).forEach((d) => (T[d.type].cat == "fab" && T[d.type].ui ? redesenha(d) : 0));
  }
  saveP();
  hudNivel();
}
let chkP = 0;
function track(ev, a, n = 1) {
  const c = PROG.c,
    inc = (k, v = n) => (c[k] = (c[k] || 0) + v);
  if (ev == "add") {
    inc("add", 1);
    inc("add:" + a, 1);
    if (/^cpu/.test(a)) inc("add:cpu", 1);
    if (a == "extrator" || a == "mina") inc("add:extrai", 1);
  } else if (ev == "item") {
    inc("item:" + a);
    inc("itens");
    // um pouco de XP por produção, proporcional ao valor
    PROG.fx += ((ITENS[a] ? ITENS[a][1] : 1) * n) / 30;
    if (PROG.fx >= 1) {
      const g = Math.floor(PROG.fx);
      PROG.fx -= g;
      xp(g);
    }
  } else inc(ev, ev == "ganho" ? a : n);
  saveP();
  if (!chkP) chkP = setTimeout(checaProgresso, 300);
}
const prontas = () => MISSOES.filter((m) => !PROG.ok[m.id] && (PROG.c[m.g[0]] || 0) >= m.g[1]);
const ativas = () => MISSOES.filter((m) => !PROG.ok[m.id]).slice(0, 3);
function checaProgresso() {
  chkP = 0;
  prontas().forEach((m) => {
    if (!PROG.avisou?.[m.id]) {
      (PROG.avisou = PROG.avisou || {})[m.id] = 1;
      toast("🎯 Missão cumprida: " + m.t + ". Toque em 🎯 para receber");
    }
  });
  CONQ.forEach((k) => {
    const v = PROG.c[k.k] || 0,
      t = k.m.filter((x) => v >= x).length;
    if (t > (PROG.conq[k.id] || 0)) {
      PROG.conq[k.id] = t;
      xp(25 * t * t);
      toast(`${MEDALHA[t - 1]} Conquista: ${k.t} (${k.m[t - 1].toLocaleString("pt-BR")})`);
    }
  });
  saveP();
  hudNivel();
}
function receber(id) {
  const m = MISSOES.find((x) => x.id == id);
  if (!m || PROG.ok[id] || (PROG.c[m.g[0]] || 0) < m.g[1]) return;
  PROG.ok[id] = 1;

  hud();
  xp(m.x);
  toast(`✅ ${m.t}: +$${m.$.toLocaleString("pt-BR")} e +${m.x} XP`);
  progressoUI();
}

const TUT = { i: -1, base: {}, h: 0 };
function tutorial(desdeInicio) {
  TUT.i = desdeInicio ? 1 : 0;
  TUT.base = { ...PROG.c };
  let c = $("#tut");
  if (!c) {
    c = document.createElement("div");
    c.id = "tut";
    c.setAttribute("role", "dialog");
    document.body.append(c);
    const r = document.createElement("div");
    r.id = "tutalvo";
    document.body.append(r);
  }
  tutMostra();
  clearInterval(TUT.h);
  TUT.h = setInterval(tutTique, 300);
}
function tutMostra() {
  const p = PASSOS[TUT.i],
    c = $("#tut");
  if (!p || !c) return;
  c.innerHTML = `<div class=tutn>${TUT.i ? `Passo ${TUT.i} de ${PASSOS.length - 2}` : "Tutorial"}<button class=x onclick="tutFim(1)" aria-label="Fechar tutorial">✕</button></div><b>${p.t}</b><p>${p.d}</p>${p.b ? `<div class=tutb>${p.b.map(([l, f], k) => `<button class="${k ? "it" : "ok"}" onclick="${f}">${l}</button>`).join("")}</div>` : `<div class=mu>Faça a ação para continuar · <a href="#" onclick="tutProx();return false">pular passo</a></div>`}`;
  c.style.display = "block";
  tutTique();
}
function tutTique() {
  const p = PASSOS[TUT.i],
    c = $("#tut"),
    r = $("#tutalvo");
  if (!p || !c) return;
  if (p.ok && p.ok()) return tutProx();
  const a = p.alvo && p.alvo(),
    vis = a && a.getClientRects().length,
    b = vis && a.getBoundingClientRect();
  // fica em cima quando o catálogo ou uma janela está aberta, ou quando o alvo está na metade de baixo
  const emCima =
    $("#sheet").classList.contains("open") ||
    $("#modal").classList.contains("open") ||
    (b && b.top + b.height / 2 > innerHeight * 0.45 && !a.closest("#dock"));
  c.classList.toggle("cima", !!emCima);
  if (vis) {
    Object.assign(r.style, { display: "block", left: b.left - 6 + "px", top: b.top - 6 + "px", width: b.width + 12 + "px", height: b.height + 12 + "px" });
  } else r.style.display = "none";
}
function tutProx() {
  TUT.i++;
  TUT.base = { ...PROG.c };
  if (TUT.i >= PASSOS.length) return tutFim();
  tutMostra();
}
function tutFim(pulou) {
  clearInterval(TUT.h);
  const c = $("#tut"),
    r = $("#tutalvo");
  if (c) c.style.display = "none";
  if (r) r.style.display = "none";
  let ja = 0;
  try {
    ja = localStorage.getItem("fabtut") == "feito";
    localStorage.setItem("fabtut", "feito");
  } catch (e) {}
  if (pulou) toast("Tutorial guardado em ⋯ › Tutorial guiado");
  else if (!ja) xp(30);
}
