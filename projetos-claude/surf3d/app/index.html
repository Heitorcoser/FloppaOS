<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tubo 3D</title>
<style>
/* Layout: canvas 3D em tela cheia; placar nos cantos; cartões sobem de baixo */
:root{
  --ink:#03222a; --foam:#f4fbf8; --lip:#46e3c6; --sun:#ffb257; --card:rgba(3,30,38,.86);
  --display:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0b3a48;color:var(--foam);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.stat{display:flex;flex-direction:column;gap:2px}
.stat.r{align-items:flex-end;text-align:right}
.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.stat b{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 var(--ink),0 0 12px rgba(0,0,0,.35)}
#tt.on{color:var(--lip)}
#msg{position:fixed;left:0;right:0;top:24%;padding-inline:16px;text-align:center;font-family:var(--display);font-size:clamp(22px,7vw,44px);line-height:1.05;text-shadow:0 3px 0 var(--ink),0 0 18px rgba(0,0,0,.4);pointer-events:none;opacity:0;transform:translateY(8px) scale(.96);transition:opacity .2s,transform .2s}
#msg.show{opacity:1;transform:none}
#guide{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:34%;height:30%;width:8px;border-radius:4px;background:rgba(3,34,42,.45);pointer-events:none}
#guide i{position:absolute;left:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px rgba(3,34,42,.5)}
#guide span{position:absolute;right:16px;font:800 10px var(--body);letter-spacing:.12em;white-space:nowrap;text-shadow:0 1px 2px #000}
#guide .t{top:-4px}#guide .b{bottom:-4px}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.pill{pointer-events:auto;appearance:none;border:1px solid rgba(244,251,248,.3);background:rgba(3,34,42,.55);color:var(--foam);border-radius:999px;font:800 12px var(--body);letter-spacing:.1em;padding:10px 14px}
.ov{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;z-index:5;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,rgba(3,30,38,.75),rgba(3,30,38,0) 60%)}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid rgba(70,227,198,.25);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card h1,.card h2{margin:0;font-family:var(--display);line-height:.95}
.card h1{font-size:clamp(38px,12vw,54px)}
.card h1 span{color:var(--lip)}
.card h2{font-size:clamp(28px,9vw,40px)}
.card p{margin:0;line-height:1.45;opacity:.92}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;line-height:1.4}
.card li b{color:var(--sun)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid div{background:rgba(244,251,248,.07);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.grid b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.grid .new{color:var(--sun)}
.btn{appearance:none;border:0;border-radius:999px;background:var(--sun);color:var(--ink);font:900 21px var(--display);padding:15px 22px;box-shadow:0 4px 0 #b86a1e}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b86a1e}
button:focus-visible{outline:3px solid var(--lip);outline-offset:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden>
  <div class="stat"><span class="lbl">PONTOS</span><b id="sc">0</b></div>
  <div class="stat r"><span class="lbl">NO TUBO</span><b id="tt">0.0s</b></div>
</div>
<div id="guide" hidden><span class="t">RÁPIDO</span><span class="b">LENTO</span><i id="dot"></i></div>
<div id="msg"></div>
<div id="bar"><button class="pill" id="cam" type="button">CÂMERA: CANAL</button><button class="pill" id="som" type="button">SOM: ON</button></div>

<div class="ov" id="menu">
  <div class="card">
    <h1>Tubo <span>3D</span></h1>
    <ul>
      <li>Arraste o dedo <b>pra cima</b>: sobe na parede e acelera.</li>
      <li>Arraste <b>pra baixo</b>: freia e entra mais fundo no tubo.</li>
      <li>Alto demais no tubo, o lábio te acerta. Fundo demais, a onda fecha em você.</li>
    </ul>
    <button class="btn" id="go" type="button">Remar</button>
  </div>
</div>
<div class="ov" id="end" hidden>
  <div class="card">
    <h2 id="eT">Onda completa</h2>
    <p id="eR"></p>
    <div class="grid">
      <div><span class="lbl">PONTOS</span><b id="eS">0</b></div>
      <div><span class="lbl">RECORDE</span><b id="eB">0</b></div>
      <div><span class="lbl">TUBOS</span><b id="eN">0</b></div>
      <div><span class="lbl">TEMPO NO TUBO</span><b id="eTT">0.0s</b></div>
    </div>
    <button class="btn" id="again" type="button">Próxima onda</button>
  </div>
</div>
<script src="three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
